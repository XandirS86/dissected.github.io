  var hinweis = document.getElementById('hinweis'), knopf = form.querySelector('button');
  function zeige(text) { hinweis.textContent = text; hinweis.hidden = !text; }
  function bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var roh = atob(s), a = new Uint8Array(roh.length);
    for (var i = 0; i < roh.length; i++) a[i] = roh.charCodeAt(i);
    return a;
  }
  function b64u(a) {
    var s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  if (!window.crypto || !crypto.subtle || !window.TextDecoder || !window.TextEncoder) { zeige(ALT); return; }
  var daten = bytes(document.getElementById('d').textContent.trim());
  var huelle = bytes('NSnURmAHmPBbgccP97rU45wzN8l9wWNAlkiB3hNRelfPnSZ1X8vctzirXqTwQKdScoEqcsHR9s1nqG0jY6pcVflbvRmI2E4CwSY82w==');
  function entschluesseln(roh) {
    return crypto.subtle.importKey('raw', roh, 'AES-GCM', false, ['decrypt'])
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: daten.subarray(0, 12) }, key, daten.subarray(12));
      })
      .then(function (klar) { return new TextDecoder('utf-8').decode(klar); });
  }
  function ersetzen(seite, k) {
    function los() {
      document.open();
      document.write(seite);
      document.close();
      // Klickt jemand auf einen Anker, bliebe sonst eine Adresse ohne Schlüssel stehen und
      // das Neuladen würde wieder nach dem Passwort fragen.
      window.addEventListener('hashchange', function () {
        if (location.hash.slice(1) !== k) {
          history.replaceState(null, '', location.pathname + location.search + '#' + k);
        }
      });
    }
    if (document.readyState === 'complete') los();
    else window.addEventListener('load', los);
  }
  function tor(meldung) {
    form.hidden = false;
    zeige(meldung);
    try { feld.focus(); } catch (e) {}
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = feld.value.normalize('NFKC').toLowerCase().replace(/[\s\-‐-―]+/g, '');
    if (!pw) return;
    knopf.disabled = true;
    zeige(WARTE);
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (basis) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: huelle.subarray(0, 16), iterations: RUNDEN, hash: 'SHA-256' },
          basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (kek) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: huelle.subarray(16, 28) }, kek, huelle.subarray(28));
      })
      .then(function (puffer) {
        var roh = new Uint8Array(puffer);
        return entschluesseln(roh).then(function (seite) {
          var k = b64u(roh);
          // Der Schlüssel wandert hinter das #, damit Neuladen ohne neue Abfrage geht. Gespeichert wird nichts.
          history.replaceState(null, '', location.pathname + location.search + '#' + k);
          ersetzen(seite, k);
        });
      })
      .catch(function () {
        knopf.disabled = false;
        zeige(FALSCH);
        try { feld.select(); } catch (e) {}
      });
  });
  var k = location.hash.slice(1), roh = null;
  if (k) { try { roh = bytes(k); } catch (e) { roh = null; } }
  if (roh && roh.length === 32) {
    entschluesseln(roh).then(function (seite) { ersetzen(seite, k); }).catch(function () { tor(LINK); });
  } else {
    tor('');
  }
})();
</script>
